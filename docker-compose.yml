version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onesight-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./onesight.db
      - MOCK_CLOUD_ENABLED=True
    volumes:
      - onesight_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onesight-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  onesight_data:
